name: Deploy Brand My Ass to Azure App Service

# Deploys to the existing brandmyass-app App Service using a PUBLISH PROFILE —
# a credential downloaded from the Azure Portal that can deploy to this one web
# app and do nothing else in the subscription.
#
# Why not azure/login with AZURE_CREDENTIALS, like the parent repo: that secret
# is a subscription-scoped service principal, GitHub secrets are write-only, and
# the person setting this repo up could not read the value out of the old repo
# to copy it across. A publish profile is self-service (one download, one
# paste), far narrower, and everything the old login powered — resource-group
# discovery, creating the web app, applying settings — is one-time provisioning
# that has already happened.
#
# ONE repository secret:
#   * AZURE_WEBAPP_PUBLISH_PROFILE — Azure Portal → brandmyass-app → Overview →
#     "Download publish profile"; paste the FILE'S ENTIRE CONTENTS (it is XML).
#     If the download button is greyed out: Configuration → General settings →
#     SCM Basic Auth Publishing → On, then retry.
#
# Runtime configuration does NOT flow through this repo. DATABASE_URL and the
# storage connection were provisioned onto the App Service by the old infra
# workflow and persist there; STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are
# set by hand in the Portal (brandmyass-app → Environment variables), which is
# where they live at runtime anyway.
#
# THE PUBLISHABLE KEY IS A BUILD INPUT, NOT A RUNTIME SETTING
#
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is compiled INTO the client bundle by
# `next build`; as an App Service setting it does nothing, silently. It is
# public by design (it ships in every visitor's JavaScript), so the live value
# is a literal below; the BMA_STRIPE_PUBLISHABLE_KEY repository variable
# overrides it, which is the path for swapping to test keys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-brandmyass
  cancel-in-progress: true

env:
  APP_NAME: ${{ vars.BRANDMYASS_APP_NAME || 'brandmyass-app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy

    steps:
      - uses: actions/checkout@v4

      - name: Check the publish profile is present
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is not set. Azure Portal → ${APP_NAME} → Overview → 'Download publish profile', then paste the file's contents as a repository secret of that name."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The literal fallback is not a leaked secret — a publishable key is
        # public by design. See the header.
        run: npm run build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.BMA_STRIPE_PUBLISHABLE_KEY || 'pk_live_51U9YEWAuZlGu5qZOeMg02FkrZoPI27dqrYDI64jh5MoySc8XGrio7T6luRaPED7DFVm3cTjmsHVwSM2zs1sNZbMv00rbn2jV8T' }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # The standalone folder is the entire deployable app: server.js, the
          # traced node_modules, and the .next/static + public that the build
          # script copies in (Next does not do that itself). The App Service's
          # startup command, `node server.js`, was set at provisioning time and
          # persists.
          package: .next/standalone

      - name: Smoke test
        # A green deploy step only means the upload succeeded. This is the step
        # that fails if the app does not actually serve a page.
        run: |
          set -euo pipefail
          URL="https://${APP_NAME}.azurewebsites.net"
          echo "Waiting for ${URL} to come up…"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✓ ${URL} returned 200"
              echo "### Brand My Ass is live" >> "$GITHUB_STEP_SUMMARY"
              echo "$URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE — cold start, retrying in 15s"
            sleep 15
          done
          echo "::error::${URL} never returned 200. Check the App Service log stream."
          exit 1
