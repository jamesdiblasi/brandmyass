name: Deploy Brand My Ass to Azure App Service

# Deploys to the existing brandmyass-app App Service with the OIDC federated
# credential that Azure's Deployment Center created when it was pointed at this
# repo. Setting that up also wrote the three AZUREAPPSERVICE_* secrets below
# into the repo automatically — which is why no human ever has to copy a
# credential anywhere for this workflow to run.
#
# The Deployment Center ALSO generated its own workflow, and that one is
# deleted on purpose. It deployed the wrong thing: `package: .` ships the repo
# root, but this app's deployable artifact is .next/standalone (the App
# Service's startup command is `node server.js`, which only exists there), and
# its build step had no publishable key, so its bundle had no card form. This
# workflow keeps the Deployment Center's credentials and this repo's build.
#
# Runtime configuration does NOT flow through this repo. DATABASE_URL and the
# storage connection were provisioned onto the App Service by the old infra
# workflow and persist there; STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are
# set by hand in the Portal (brandmyass-app → Environment variables), which is
# where they live at runtime anyway.
#
# THE PUBLISHABLE KEY IS A BUILD INPUT, NOT A RUNTIME SETTING
#
# NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY is compiled INTO the client bundle by
# `next build`; as an App Service setting it does nothing, silently. It is
# public by design (it ships in every visitor's JavaScript), so the live value
# is a literal below; the BMA_STRIPE_PUBLISHABLE_KEY repository variable
# overrides it, which is the path for swapping to test keys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-brandmyass
  cancel-in-progress: true

env:
  APP_NAME: ${{ vars.BRANDMYASS_APP_NAME || 'brandmyass-app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy

    permissions:
      id-token: write   # the OIDC login exchanges a GitHub token for Azure access
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The literal fallback is not a leaked secret — a publishable key is
        # public by design. See the header.
        run: npm run build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.BMA_STRIPE_PUBLISHABLE_KEY || 'pk_live_51U9YEWAuZlGu5qZOeMg02FkrZoPI27dqrYDI64jh5MoySc8XGrio7T6luRaPED7DFVm3cTjmsHVwSM2zs1sNZbMv00rbn2jV8T' }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0292952CA31E4A859736AADD13AFCB8C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D13A372D156143B69FD197774F6DFFC9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_326C520A827942A1AB6F020F21FFEFE0 }}

      - name: Make sure the startup command survived the Deployment Center
        # Connecting the Deployment Center can rewrite an app's startup
        # configuration. The standalone artifact only works as `node server.js`,
        # so it is reasserted on every deploy. Non-fatal: if this credential
        # lacks config rights the smoke test below still catches a wrong value.
        run: |
          az webapp config set -g leadgen -n "$APP_NAME" --startup-file "node server.js" -o none \
            || echo "::warning::could not (re)set the startup command; if the smoke test fails, set it in the Portal: General settings → Startup Command → node server.js"
          # Always On keeps the app warm. Social-card crawlers (X's included)
          # time out after a few seconds; a cold start here takes 15+, so a
          # sleeping app unfurls as no card at all — and X caches that.
          az webapp config set -g leadgen -n "$APP_NAME" --always-on true -o none \
            || echo "::warning::could not enable Always On (plan tier may not support it); set it in the Portal: Configuration → General settings → Always on"

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: 'Production'
          # The standalone folder is the entire deployable app: server.js, the
          # traced node_modules, and the .next/static + public that the build
          # script copies in (Next does not do that itself).
          package: .next/standalone

      - name: Smoke test
        # A green deploy step only means the upload succeeded. This is the step
        # that fails if the app does not actually serve a page.
        run: |
          set -euo pipefail
          URL="https://${APP_NAME}.azurewebsites.net"
          echo "Waiting for ${URL} to come up…"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✓ ${URL} returned 200"
              # Booleans only — the endpoint is designed to be safe to print.
              HEALTH=$(curl -s --max-time 20 "${URL}/api/health" || echo '{}')
              echo "health: $HEALTH"
              # Share-card check: the image URLs must be absolute and point at
              # this host, or a link pasted on X unfurls nothing.
              curl -s --max-time 20 "$URL" | grep -o '<meta[^>]*\(og:image\|twitter:image\|twitter:card\)[^>]*>' || echo "::warning::no share-card meta tags found on /"
              echo "### Brand My Ass is live" >> "$GITHUB_STEP_SUMMARY"
              echo "$URL" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              echo "$HEALTH" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE — cold start, retrying in 15s"
            sleep 15
          done
          echo "::error::${URL} never returned 200. Check the App Service log stream."
          exit 1
