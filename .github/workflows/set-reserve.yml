name: Set the Left Undercarriage reserve (live-test one-off)

# Applies the reserve change to the DATABASE, which is where the enforced
# minimum actually lives — lib/zones.ts is display copy; zone_state.reserve_cents
# is what createBid checks a bid against. The seed normally syncs the two, but
# the workflow that runs it is dormant without admin credentials, so this
# borrows the app's own DATABASE_URL from the App Service settings instead.
# The brandmyass_app role has UPDATE on zone_state, which is all this needs.
#
# Triggered by pushes to THIS FILE only, because the session driving the repo
# cannot dispatch workflows — editing the file below is how it is re-run, and
# deleting it can never fire it.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/set-reserve.yml']

# ---- edit these two lines and push to change a price -------------------------
env:
  ZONE_ID: left-under
  RESERVE_CENTS: '100'
# ------------------------------------------------------------------------------

permissions:
  id-token: write
  contents: read

jobs:
  set-reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0292952CA31E4A859736AADD13AFCB8C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D13A372D156143B69FD197774F6DFFC9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_326C520A827942A1AB6F020F21FFEFE0 }}

      - name: Update the reserve in zone_state
        run: |
          set -euo pipefail
          # One value, straight to a variable, masked before anything else can
          # print it. Never list the full settings output — it contains secrets.
          DB_URL=$(az webapp config appsettings list -g leadgen -n brandmyass-app \
                     --query "[?name=='DATABASE_URL'].value | [0]" -o tsv)
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "None" ]; then
            echo "::error::Could not read DATABASE_URL from the App Service."
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          export DATABASE_URL="$DB_URL"

          node -e '
            const { Client } = require("pg");
            (async () => {
              const zone = process.env.ZONE_ID;
              const cents = Number(process.env.RESERVE_CENTS);
              if (!/^[a-z-]+$/.test(zone) || !Number.isSafeInteger(cents) || cents <= 0) {
                throw new Error("bad ZONE_ID / RESERVE_CENTS");
              }
              const c = new Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: true } });
              await c.connect();
              const r = await c.query(
                "update zone_state set reserve_cents = $2, updated_at = now() where zone_id = $1 returning zone_id, reserve_cents",
                [zone, cents],
              );
              if (r.rowCount === 0) throw new Error(`zone ${zone} not found in zone_state`);
              console.log("updated:", r.rows[0]);
              const all = await c.query("select zone_id, reserve_cents from zone_state order by reserve_cents desc");
              for (const row of all.rows) console.log(` ${String(row.reserve_cents).padStart(6)}  ${row.zone_id}`);
              await c.end();
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
